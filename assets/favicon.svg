<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ML Atlas">
  <!--
    Mark: three inputs fanning into a node and out again — the smallest
    honest picture of a learned function. General to the subject, not a
    personal monogram.
  -->
  <style>
    .tile  { fill: #0c1317; stroke: none; }
    .glyph { fill: #33d6bb; stroke: #33d6bb; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #12181c; stroke: #2a4b47; stroke-width: 1.5; }
    }
  </style>
  <rect class="tile" x=".75" y=".75" width="62.5" height="62.5" rx="15"/>
  <g class="glyph" fill="none" stroke-width="3.4" stroke-linecap="round">
    <path d="M18 16L34 32M18 32H34M18 48L34 32M34 32H48"/>
  </g>
  <g class="glyph" stroke="none">
    <circle cx="18" cy="16" r="5"/><circle cx="18" cy="32" r="5"/><circle cx="18" cy="48" r="5"/>
    <circle cx="34" cy="32" r="6"/><circle cx="48" cy="32" r="5"/>
  </g>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ML/DS Master Study Guide</title>
<meta name="description" content="A 55-topic machine learning and data science reference: math foundations, classical ML, neural networks, deep learning, NLP, LLMs, RAG, agents, MLOps and ML system design."/>
<meta name="color-scheme" content="dark light"/>
<meta name="theme-color" content="#0a0e10" media="(prefers-color-scheme: dark)"/>
<meta name="theme-color" content="#f6f8f9" media="(prefers-color-scheme: light)"/>

<!-- Resolve the theme before first paint: no flash of the wrong palette. -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem('ml-guide-theme');
      var dark = saved ? saved === 'dark'
                       : !window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/style.css"/>

<!--
  KaTeX, Prism, CodeMirror and Pyodide are NOT loaded here.
  assets/js/lazy.js fetches each one the first time a topic
  actually needs it. Pyodide in particular is a multi-megabyte
  WASM runtime that only 2 of 55 topics use.
-->
<script type="module" src="assets/js/app.js"></script>
</head>

<body>

<!-- Inline icon sprite: no external icon requests. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-mark" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 17.5L32 36L44 17.5"/><path d="M32 36V47"/>
    </g>
    <g fill="currentColor">
      <circle cx="20" cy="17.5" r="5.5"/><circle cx="44" cy="17.5" r="5.5"/><circle cx="32" cy="47" r="5.5"/>
    </g>
  </symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
    <path d="M21 12.8A8.5 8.5 0 1111.2 3a6.6 6.6 0 009.8 9.8z"/>
  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
  </symbol>
  <symbol id="i-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M4 7h16M4 12h16M4 17h16"/>
  </symbol>
  <symbol id="i-chev-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 6l-6 6 6 6"/>
  </symbol>
  <symbol id="i-chev-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 6l6 6-6 6"/>
  </symbol>
  <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M4 8h16M4 12h16M4 16h16"/>
  </symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M4 10h16M4 14h16"/>
  </symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/>
  </symbol>
</svg>

<div class="layout">

  <!-- ═══════════ SIDEBAR ═══════════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-hdr">
      <span class="sb-mark"><svg><use href="#i-mark"/></svg></span>
      <div>
        <div class="sb-logo">ML/DS Study Guide</div>
        <div class="sb-sub">Concept &amp; interview reference</div>
      </div>
    </div>

    <div class="sb-progress">
      <div class="sb-progress-label">
        <span id="progress-label">0 / 55 read</span>
        <span id="home-pct">0%</span>
      </div>
      <div class="sb-progress-track"><div class="sb-progress-fill" id="progress-bar-fill"></div></div>
    </div>

    <div class="sb-tools">
      <button class="sb-search-btn" id="search-trigger">
        <svg><use href="#i-search"/></svg>
        <span>Search topics</span>
        <span class="kbd">⌘K</span>
      </button>
      <button class="sb-icon-btn" id="sb-expand-all" title="Expand all sections" aria-label="Expand all sections">
        <svg><use href="#i-expand"/></svg>
      </button>
      <button class="sb-icon-btn" id="sb-collapse-all" title="Collapse all sections" aria-label="Collapse all sections">
        <svg><use href="#i-collapse"/></svg>
      </button>
      <button class="sb-icon-btn" id="sb-toggle" title="Hide sidebar" aria-label="Hide sidebar">
        <svg><use href="#i-chev-left"/></svg>
      </button>
    </div>

    <nav class="sb-scroll" id="sb-groups" aria-label="Topics">
      <!-- generated from assets/js/topics.js -->
    </nav>
  </aside>

  <button class="sb-icon-btn" id="sb-expand-btn" title="Show sidebar" aria-label="Show sidebar">
    <svg><use href="#i-chev-right"/></svg>
  </button>

  <!-- ═══════════ MAIN ═══════════ -->
  <main class="main">
    <div class="topbar">
      <div class="tb-left">
        <span class="tb-crumb" id="tb-crumb">Start here</span>
        <span class="tb-sep">›</span>
        <span class="tb-title" id="tb-title">Home</span>
      </div>
      <div class="tb-right">
        <span class="tb-tag" id="tb-time">55 topics</span>
        <button class="tb-btn tb-read-btn" id="tb-read-btn" hidden>Mark read</button>
        <button class="tb-btn" id="tb-home-btn" hidden><svg><use href="#i-home"/></svg> Home</button>
        <button class="tb-btn" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle light / dark">
          <svg id="theme-icon"><use href="#i-moon"/></svg>
        </button>
      </div>
      <div id="read-progress"></div>
    </div>

    <div class="content-shell">
      <div id="topic-container"></div>
      <aside class="toc" id="toc" hidden aria-label="On this page"></aside>
    </div>
  </main>
</div>

<!-- ═══════════ COMMAND PALETTE ═══════════ -->
<div id="palette" hidden role="dialog" aria-modal="true" aria-label="Search topics">
  <div id="palette-backdrop"></div>
  <div class="palette-box">
    <div class="palette-head">
      <svg><use href="#i-search"/></svg>
      <input id="palette-input" type="text" placeholder="Search all 55 topics…" autocomplete="off" spellcheck="false"/>
      <span id="palette-hint"></span>
    </div>
    <div id="palette-list"></div>
    <div class="palette-foot">
      <span><span class="kbd">↑↓</span> navigate</span>
      <span><span class="kbd">↵</span> open</span>
      <span><span class="kbd">esc</span> close</span>
      <span style="margin-left:auto"><span class="kbd">j</span> <span class="kbd">k</span> prev / next topic</span>
    </div>
  </div>
</div>

<button class="mob-tog" id="mob-tog" aria-label="Open topic list"><svg><use href="#i-menu"/></svg></button>
<div class="mob-overlay"></div>

<noscript>
  <div style="padding:40px 24px;max-width:640px;margin:0 auto">
    <h1 style="font-family:'Space Grotesk',sans-serif">ML/DS Master Study Guide</h1>
    <p style="color:#94a3ac;line-height:1.7">This guide loads its topics dynamically and needs JavaScript enabled.
    You can still read the source files directly under <code>topics/</code>.</p>
  </div>
</noscript>

</body>
</html>
